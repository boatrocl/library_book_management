<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="758px" preserveAspectRatio="none" style="width:1378px;height:758px;background:#FFFFFF;" version="1.1" viewBox="0 0 1378 758" width="1378px" zoomAndPan="magnify"><title>State Diagram &#8212; Loan</title><defs/><g><text fill="#000000" font-family="Tahoma" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="155.5534" x="604.2604" y="24.9659">State Diagram &#8212; Loan</text><g id="ACTIVE"><rect fill="#EAF2F8" height="52.6882" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="254.9017" x="764.48" y="144.0679"/><line style="stroke:#34495E;stroke-width:0.5;" x1="764.48" x2="1019.3817" y1="170.412" y2="170.412"/><text fill="#000000" font-family="Tahoma" font-size="12" lengthAdjust="spacing" textLength="39.8643" x="871.9987" y="161.896">ACTIVE</text><text fill="#000000" font-family="Tahoma" font-size="12" lengthAdjust="spacing" textLength="234.9017" x="769.48" y="188.2401">entry / dueDate from MemberTier (BR-05)</text></g><g id="OVERDUE"><rect fill="#EAF2F8" height="52.6882" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="256.0177" x="545.92" y="290.7579"/><line style="stroke:#34495E;stroke-width:0.5;" x1="545.92" x2="801.9377" y1="317.102" y2="317.102"/><text fill="#000000" font-family="Tahoma" font-size="12" lengthAdjust="spacing" textLength="54.9124" x="646.4727" y="308.586">OVERDUE</text><text fill="#000000" font-family="Tahoma" font-size="12" lengthAdjust="spacing" textLength="236.0177" x="550.92" y="334.9301">entry / scheduler detects today &gt; dueDate</text></g><g id="RETURNED"><rect fill="#EAF2F8" height="69.0323" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="309.1781" x="683.34" y="600.4779"/><line style="stroke:#34495E;stroke-width:0.5;" x1="683.34" x2="992.5181" y1="626.822" y2="626.822"/><text fill="#000000" font-family="Tahoma" font-size="12" lengthAdjust="spacing" textLength="61.5964" x="807.1308" y="618.306">RETURNED</text><text fill="#000000" font-family="Tahoma" font-size="12" lengthAdjust="spacing" textLength="221.3656" x="688.34" y="644.6501">when every item in the loan is returned</text><text fill="#000000" font-family="Tahoma" font-size="12" lengthAdjust="spacing" textLength="289.1781" x="688.34" y="660.9942">publish BookReturnedEvent for each returned copy</text></g><g id="LOST"><rect fill="#EAF2F8" height="69.0323" rx="12.5" ry="12.5" style="stroke:#34495E;stroke-width:0.5;" width="266.6497" x="787.61" y="437.4479"/><line style="stroke:#34495E;stroke-width:0.5;" x1="787.61" x2="1054.2597" y1="463.792" y2="463.792"/><text fill="#000000" font-family="Tahoma" font-size="12" lengthAdjust="spacing" textLength="28.9202" x="906.4748" y="455.276">LOST</text><text fill="#000000" font-family="Tahoma" font-size="12" lengthAdjust="spacing" textLength="246.6497" x="792.61" y="481.6201">scheduler detects overdueDays &gt; 60 (BR-08)</text><text fill="#000000" font-family="Tahoma" font-size="12" lengthAdjust="spacing" textLength="183.5893" x="792.61" y="497.9642">create replacement-price charge</text></g><ellipse cx="891.93" cy="56.0679" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="837.93" cy="741.5079" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="837.93" cy="741.5079" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="43" data-uid="ent0003" id="entity_GMN2"><path d="M836.65,295.7579 L836.65,313.0979 L802.43,317.0979 L836.65,321.0979 L836.65,338.4461 A0,0 0 0 0 836.65,338.4461 L1057.2114,338.4461 A0,0 0 0 0 1057.2114,338.4461 L1057.2114,305.7579 L1047.2114,295.7579 L836.65,295.7579 A0,0 0 0 0 836.65,295.7579" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1047.2114,295.7579 L1047.2114,305.7579 L1057.2114,305.7579 L1047.2114,295.7579" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Tahoma" font-size="12" lengthAdjust="spacing" textLength="190.0333" x="842.65" y="313.586">The scheduler updates loan state.</text><text fill="#000000" font-family="Tahoma" font-size="12" lengthAdjust="spacing" textLength="199.5614" x="842.65" y="329.9301">It does not add a daily fine balance.</text></g><g class="entity" data-entity="GMN5" data-source-line="48" data-uid="ent0006" id="entity_GMN5"><path d="M417.15,450.6179 L417.15,493.3061 A0,0 0 0 0 417.15,493.3061 L752.7083,493.3061 A0,0 0 0 0 752.7083,493.3061 L752.7083,475.9579 L787.38,471.9579 L752.7083,467.9579 L752.7083,460.6179 L742.7083,450.6179 L417.15,450.6179 A0,0 0 0 0 417.15,450.6179" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M742.7083,450.6179 L742.7083,460.6179 L752.7083,460.6179 L742.7083,450.6179" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Tahoma" font-size="12" lengthAdjust="spacing" textLength="196.6814" x="423.15" y="468.446">Renewal is rejected for LOST loans.</text><text fill="#000000" font-family="Tahoma" font-size="12" lengthAdjust="spacing" textLength="314.5583" x="423.15" y="484.7901">Fine charges are recorded by the return/scheduler flow.</text></g><!--link *start* to ACTIVE--><g class="link" data-entity-1="*start*" data-entity-2="ACTIVE" data-source-line="12" data-uid="lnk3" id="link_*start*_ACTIVE"><path d="M891.93,66.2579 C891.93,83.0279 891.93,113.1279 891.93,137.8479" fill="none" id="*start*-to-ACTIVE" style="stroke:#2E4053;stroke-width:1;"/><polygon fill="#2E4053" points="891.93,143.8479,895.93,134.8479,891.93,138.8479,887.93,134.8479,891.93,143.8479" style="stroke:#2E4053;stroke-width:1;"/><text fill="#000000" font-family="Tahoma" font-size="12" lengthAdjust="spacing" textLength="115.6088" x="892.93" y="109.896">checkout committed</text></g><!--link ACTIVE to ACTIVE--><g class="link" data-entity-1="ACTIVE" data-entity-2="ACTIVE" dat