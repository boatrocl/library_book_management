# ค่าเฉพาะตอนใช้งานจริง (profile: prod) เปิดด้วย SPRING_PROFILES_ACTIVE=prod
# ค่าอื่นทั้งหมดอยู่ใน application.properties

# ไม่ log SQL: ลดปริมาณ log และไม่ให้ข้อมูลในคำสั่ง SQL หลุดลง log ของเซิร์ฟเวอร์
logging.level.org.hibernate.SQL=warn
spring.jpa.properties.hibernate.format_sql=false
logging.level.com.libraflow=INFO
# ไม่ส่ง stack trace กลับไปให้ผู้เรียก API
server.error.include-stacktrace=never
server.error.include-message=never
