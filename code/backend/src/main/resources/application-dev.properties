# ค่าเฉพาะตอนพัฒนาบนเครื่อง (profile: dev)
# ค่าอื่นทั้งหมดอยู่ใน application.properties

# แสดง SQL ที่ Hibernate ยิงจริงใน log เพื่อไล่ดู N+1 และตรวจ query
logging.level.org.hibernate.SQL=debug
# จัดรูป SQL ให้อ่านง่ายหลายบรรทัด
spring.jpa.properties.hibernate.format_sql=true
# log ของโค้ดโปรเจกต์ละเอียดขึ้น
logging.level.com.libraflow=DEBUG
