spring.application.name=library

# ---------- Datasource ----------
# Values come from environment variables; fallbacks are for local development.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/libraflow}
spring.datasource.username=${DB_USERNAME:libraflow}
spring.datasource.password=${DB_PASSWORD:changeme}

# ---------- JPA / Hibernate ----------
# validate: Hibernate checks that entities match Flyway-managed schema and never alters it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- JWT / Security ----------
# JWT_SECRET must be a Base64 encoded secret of at least 32 bytes (256 bits).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# ---------- springdoc / Swagger UI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.persist-authorization=true

# ---------- Logging (development) ----------
logging.level.org.hibernate.SQL=debug