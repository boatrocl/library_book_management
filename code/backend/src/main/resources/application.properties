spring.application.name=library

# ---------- Datasource ----------
# Values come from environment variables (.env); the fallback after ":" is for local dev only.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/libraflow}
spring.datasource.username=${DB_USERNAME:libraflow}
spring.datasource.password=${DB_PASSWORD:changeme}

# ---------- JPA / Hibernate ----------
# validate: Hibernate only checks that entities match the schema, never alters it.
# The schema belongs to Flyway alone.
spring.jpa.hibernate.ddl-auto=validate
# false: the persistence session closes when the transaction ends, so lazy loading
# outside the service layer fails loudly instead of firing hidden queries.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- springdoc / Swagger UI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------- Logging (development) ----------
logging.level.org.hibernate.SQL=debug
