spring.application.name=library
spring.dotenv.directory=../../

# ---------- Profile ----------
# dev เป็นค่าเริ่มต้นเพื่อไม่ให้การรันบนเครื่องนักพัฒนาเปลี่ยนพฤติกรรม
# ตอน deploy ให้ตั้ง environment variable SPRING_PROFILES_ACTIVE=prod (มาก่อนค่านี้เสมอ)
# ค่าเฉพาะ profile อยู่ใน application-dev.properties และ application-prod.properties
spring.profiles.active=dev

# ---------- Datasource ----------
# Values come from environment variables; fallbacks are for local development.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/libraflow}
spring.datasource.username=${DB_USERNAME:libraflow}
spring.datasource.password=${DB_PASSWORD:changeme}

# ---------- JPA / Hibernate ----------
# validate: Hibernate checks that entities match Flyway-managed schema and never alters it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- JWT / Security ----------
# JWT_SECRET must be a Base64 encoded secret of at least 32 bytes (256 bits).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# ---------- springdoc / Swagger UI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.persist-authorization=true

# ---------- Logging ----------
# ระดับ log ของ Hibernate/SQL แยกไปไว้ใน application-dev.properties และ application-prod.properties
logging.level.root=INFO
